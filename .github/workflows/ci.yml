name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/dutch-language-support]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Capture whisper.cpp submodule commit
        id: whisper
        run: echo "sha=$(git submodule status whisper.cpp | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache whisper.cpp build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib/
          key: whisper-cpp-${{ steps.whisper.outputs.sha }}-${{ hashFiles('.gitmodules', 'whisper.cpp/CMakeLists.txt') }}-macos

      - name: Build whisper.cpp
        run: |
          if [ ! -f lib/libwhisper.a ]; then
            ./scripts/build-whisper.sh
          fi

      - name: Build app
        run: make app

      - name: Verify bundled localizations
        run: |
          test -s build/WhisperDictation.app/Contents/Resources/en.lproj/Localizable.strings
          test -s build/WhisperDictation.app/Contents/Resources/nl.lproj/Localizable.strings

      - name: Package and verify test DMG
        run: |
          ./scripts/create-dmg.sh
          hdiutil verify build/WhisperDictation.dmg
          DMG_MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$DMG_MOUNT" >/dev/null 2>&1 || true; rmdir "$DMG_MOUNT" 2>/dev/null || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$DMG_MOUNT" build/WhisperDictation.dmg
          test -x "$DMG_MOUNT/WhisperDictation.app/Contents/MacOS/WhisperDictation"
          codesign --verify --deep --strict "$DMG_MOUNT/WhisperDictation.app"
          test -s "$DMG_MOUNT/WhisperDictation.app/Contents/Resources/nl.lproj/Localizable.strings"
          test -L "$DMG_MOUNT/Applications"
          cp TESTEN.nl.md build/LEESMIJ-testversie.md
          cd build
          shasum -a 256 WhisperDictation.dmg > WhisperDictation.dmg.sha256

      - name: Upload test installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperDictation-Dutch-test-macOS
          if-no-files-found: error
          path: |
            build/WhisperDictation.dmg
            build/WhisperDictation.dmg.sha256
            build/LEESMIJ-testversie.md

  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Capture whisper.cpp submodule commit
        id: whisper
        run: echo "sha=$(git submodule status whisper.cpp | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Same cache key as the build job so both jobs share the compiled static libs.
      - name: Cache whisper.cpp build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib/
          key: whisper-cpp-${{ steps.whisper.outputs.sha }}-${{ hashFiles('.gitmodules', 'whisper.cpp/CMakeLists.txt') }}-macos

      # The test target links the whisper static libs, so build them if not cached.
      - name: Build whisper.cpp
        run: |
          if [ ! -f lib/libwhisper.a ]; then
            ./scripts/build-whisper.sh
          fi

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: xcodebuild test -project WhisperDictation.xcodeproj -scheme WhisperDictation -destination "platform=macOS" -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TestResults
          path: build/TestResults.xcresult

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 -m unittest discover -s scripts/tests -v
